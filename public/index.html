<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HYRON V-0.4</title><link rel="stylesheet" href="/style.css"></head><body>
<section id="auth" class="auth-box" hidden><h1>HYRON</h1><p>Ideias, código e boas conversas.</p><form id="auth-form"><label>Acesso <select id="auth-mode"><option value="login">Entrar</option><option value="register">Cadastrar com convite</option><option value="setup">Configuração inicial do administrador</option></select></label><label>Usuário <input id="username" required minlength="3" maxlength="32" autocomplete="username"></label><label>Senha <input id="password" type="password" required minlength="12" autocomplete="current-password"></label><label id="invite-wrap" hidden>Código do convite <input id="invite" autocomplete="off"></label><label id="setup-wrap" hidden>Chave de configuração inicial <input id="setup" type="password" autocomplete="off"></label><button id="auth-submit">Entrar</button><p id="auth-error" role="alert"></p></form></section>
<main id="app" class="shell" hidden><header><div class="logo">ϟ</div><div><h1>HYRON</h1><small>Ideias, código e boas conversas.</small><p id="who" class="hint"></p></div><button id="logout" class="ghost">Sair</button></header>
<nav class="history-bar"><select id="conversation" aria-label="Conversa"></select><button id="new">+ Nova</button><button id="rename">Renomear</button><button id="clear">Excluir</button></nav><input id="search" placeholder="Filtrar títulos de conversas..." aria-label="Pesquisar conversas"><div class="actions"><button id="memory">🧠 Memórias</button><button id="claim">Importar V-0.3</button><button id="admin" hidden>👑 Convites e usuários</button></div>
<section id="chat" class="chat" aria-live="polite"></section><form id="form"><textarea id="prompt" placeholder="Converse com HYRON..." rows="2" maxlength="4000" required></textarea><div class="actions"><label class="provider-label">Modelo <select id="provider"></select></label><button type="button" id="mic">🎙 Falar</button><button type="button" id="speak">🔊 Voz ligada</button><button id="send">Enviar ➤</button></div></form><p class="hint">HYRON V-0.4 · Acesso por convite · Memória privada · Cloudflare D1</p></main><script src="/app.js" defer></script></body></html>
