<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1413"><title>HYRON — Inteligência com personalidade</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="shell"><header><div class="logo" aria-hidden="true">ϟ</div><div><h1>HYRON</h1><small>Ideias, código e boas conversas.</small></div><button id="settings" class="ghost" title="Configurar acesso">⚙</button></header><section id="chat" class="chat" aria-live="polite"><article class="bubble ai">HYRON online. Pode começar. Prometo julgar suas ideias só quando elas merecerem.</article></section><form id="form"><textarea id="prompt" placeholder="Pergunte alguma coisa ao HYRON..." rows="2" maxlength="4000" required></textarea><div class="actions"><label class="provider-label" for="provider">Modelo <select id="provider"><option value="">Automático</option></select></label><button type="button" id="mic" title="Ditado por voz">🎙 Falar</button><button type="button" id="speak" title="Ativar ou desativar leitura em voz alta">🔊 Voz: ligada</button><button type="button" id="clear" title="Limpar conversa">Limpar</button><button id="send" type="submit">Enviar ➤</button></div></form><p class="hint">Protótipo v0.2 · Sem memória no servidor · O reconhecimento de voz depende do navegador</p></main><script src="/app.js" defer></script></body></html>
