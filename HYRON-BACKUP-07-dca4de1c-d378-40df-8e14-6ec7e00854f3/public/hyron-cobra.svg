<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" style="color:#78e6cd" role="img" aria-labelledby="title desc">
 <title id="title">HYRON — Cobra-rei</title>
 <desc id="desc">Cobra-rei frontal em postura de ataque, com olhar estreito, mandibula e garganta integradas, boca parcialmente aberta e presas proporcionais, capuz expandido, escamas e corpo enrolado. Ilustração inteiramente vetorial com cor principal personalizável.</desc>
